name: Configure Staging Stripe

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number (used to build the Netlify staging URL)"
        required: true
        type: string

jobs:
  configure-stripe:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Stripe env vars + add admin SSH key
        uses: appleboy/ssh-action@v1
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
        with:
          host: 51.159.98.163
          username: root
          key: ${{ secrets.STAGING_SSH_KEY }}
          debug: false
          allenvs: false
          envs: PR_NUMBER,STRIPE_SECRET_KEY
          envs_format: |
            set +vx
            export {NAME}={VALUE}
          script: |
            set +vx
            set -e

            if ! [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "Invalid PR number: $PR_NUMBER"
              exit 1
            fi

            APP_BASE_URL="https://deploy-preview-${PR_NUMBER}--zenao.netlify.app"

            # Add admin SSH key for future direct access
            mkdir -p ~/.ssh
            echo 'ssh-rsa  tajsurf@gmail.com' >> ~/.ssh/authorized_keys
            sort -u -o ~/.ssh/authorized_keys ~/.ssh/authorized_keys
            chmod 600 ~/.ssh/authorized_keys

            # Add Stripe + app config to backend.env (idempotent)
            cd zenao
            # Standalone workflow: do not require a newer remote checkout.
            (
                set +vx
                set -eu

                if ! awk 'BEGIN {
                    value = ENVIRON["STRIPE_SECRET_KEY"]
                    if (value == "" || index(value, "\r") || index(value, "\n")) exit 1
                }' </dev/null; then
                    printf '%s\n' 'Stripe credential must be a nonempty single line' >&2
                    exit 1
                fi

                if [ -L backend.env ] || { [ -e backend.env ] && [ ! -f backend.env ]; }; then
                    printf '%s\n' 'Refusing a non-regular backend.env' >&2
                    exit 1
                fi

                umask 077
                stripe_env_tmp=$(mktemp backend.env.tmp.XXXXXX)
                trap 'rm -f "$stripe_env_tmp"' 0
                trap 'exit 1' HUP INT TERM

                # Retain the existing file's mode; a new environment file starts private.
                stripe_env_input=/dev/null
                if [ -f backend.env ]; then
                    cp -p backend.env "$stripe_env_tmp"
                    stripe_env_input=backend.env
                fi

                # Credential bytes stay data in ENVIRON, not shell source, sed syntax or argv.
                if ! awk '
                    /^ZENAO_STRIPE_SECRET_KEY=/ {
                        print "ZENAO_STRIPE_SECRET_KEY=" ENVIRON["STRIPE_SECRET_KEY"]
                        found = 1
                        next
                    }
                    { print }
                    END {
                        if (!found) print "ZENAO_STRIPE_SECRET_KEY=" ENVIRON["STRIPE_SECRET_KEY"]
                    }
                ' "$stripe_env_input" >"$stripe_env_tmp"; then
                    printf '%s\n' 'Unable to prepare Stripe environment update' >&2
                    exit 1
                fi

                mv "$stripe_env_tmp" backend.env
            )

            grep -q 'ZENAO_PAID_EVENTS_ENABLED' backend.env 2>/dev/null && \
              sed -i 's|^ZENAO_PAID_EVENTS_ENABLED=.*|ZENAO_PAID_EVENTS_ENABLED=true|' backend.env || \
              echo 'ZENAO_PAID_EVENTS_ENABLED=true' >> backend.env

            grep -q 'ZENAO_APP_BASE_URL' backend.env 2>/dev/null && \
              sed -i "s|^ZENAO_APP_BASE_URL=.*|ZENAO_APP_BASE_URL=${APP_BASE_URL}|" backend.env || \
              echo "ZENAO_APP_BASE_URL=${APP_BASE_URL}" >> backend.env

            # Force recreate backend container to pick up new env
            docker compose -f staging.docker-compose.yml down backend
            docker compose -f staging.docker-compose.yml up -d --build backend

            echo "✅ Stripe configured and backend restarted"
