name: Deploy Prod

on:
  workflow_dispatch:

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version-file: go.mod
          cache-key-suffix: deploy-prod

      - name: Get go binaries path
        id: go-bin-path
        run: echo "PATH=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"
      - name: Cache atlas
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-bin-path.outputs.PATH }}
          key: ${{ runner.os }}-atlas-bin5-v1.1.0
      - name: Install atlas
        if: steps.cache.outputs.cache-hit != 'true'
        run: make install-atlas

      - name: Get current date
        id: date
        run: echo "::set-output name=date::$(date +'%Y-%m-%d-%s')"

      - name: Enable maintenance mode
        uses: appleboy/ssh-action@v1
        with:
          host: 62.210.92.144
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          debug: false
          allenvs: false
          script: |
            set +vx
            set -e
            cd zenao
            git fetch
            git checkout ${{ github.sha }}
            yq -iy 'del(.services.backend.command)' prod.backend.docker-compose.yml
            yq -iy '.services.backend |= ({"command": "--maintenance"} + .)' prod.backend.docker-compose.yml
            docker compose -f prod.backend.docker-compose.yml up -d backend

      - name: Backup DB
        shell: bash
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: |
          set +vx
          if ! printf 'Authorization: Bearer %s\nContent-Type: application/json\n' "$TURSO_API_TOKEN" | \
            curl -q -s -f -X POST --header @- --output /dev/null \
            -d '{"name": "zenao-prod-backup-${{ steps.date.outputs.date }}", "group": "zenao", "seed": {"type": "database", "name": "zenao-prod"} }' \
                "https://api.turso.tech/v1/organizations/samourai-coop/databases"; then
            echo "API call failed"
            exit 1
          fi

      - name: Migrate DB
        id: migrate
        env:
          TURSO_TOKEN: ${{ secrets.PROD_TURSO_TOKEN }}
        run: |
          set +vx
          # Atlas errors can include the credential-bearing libsql URL.
          if ! atlas migrate apply --dir "file://migrations" --env prod >/dev/null 2>&1; then
            echo "Database migration failed; credential-bearing output withheld" >&2
            exit 1
          fi

      - name: Rollback maintenance on migration failure
        if: failure() && steps.migrate.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: 62.210.92.144
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          debug: false
          allenvs: false
          script: |
            set +vx
            set -e
            cd zenao
            git restore prod.backend.docker-compose.yml
            docker compose -f prod.backend.docker-compose.yml up -d --build backend

      - name: Upgrade backend
        uses: appleboy/ssh-action@v1
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
        with:
          host: 62.210.92.144
          username: root
          key: ${{ secrets.PROD_SSH_KEY }}
          debug: false
          allenvs: false
          envs: STRIPE_SECRET_KEY
          # Disable remote startup tracing before the credential export itself.
          envs_format: |
            set +vx
            export {NAME}={VALUE}
          # git restore is there to disable maintenance mode
          script: |
            set +vx
            set -e
            cd zenao

            # The helper reads the credential from its environment, never argv.
            sh scripts/update-stripe-env.sh

            grep -q '^ZENAO_PAID_EVENTS_ENABLED=' backend.env 2>/dev/null && \
              sed -i 's|^ZENAO_PAID_EVENTS_ENABLED=.*|ZENAO_PAID_EVENTS_ENABLED=true|' backend.env || \
              echo 'ZENAO_PAID_EVENTS_ENABLED=true' >> backend.env

            docker compose -f prod.backend.docker-compose.yml up -d --wait otel-collector jaeger
            git restore prod.backend.docker-compose.yml
            docker compose -f prod.backend.docker-compose.yml up -d --build backend
